<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 440px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 182, 193, 0.2);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .login-box h2 {
            text-align: center;
            background: linear-gradient(90deg, #ffb6c1, #d890a5);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 40px;
            font-size: 24px;
        }

        .input-item {
            margin-bottom: 24px;
        }

        .input-item input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 182, 193, 0.2);
            border-radius: 12px;
            outline: none;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-item input:focus {
            border-color: #ffb6c1;
            box-shadow: 0 0 10px rgba(255, 182, 193, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #ffb6c1, #d890a5);
            border: none;
            color: #1a1a2e;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4);
        }

        .link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #aaa;
        }

        .link a {
            color: #ffb6c1;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>账号登录</h2>

    <form id="loginForm">
        <div class="input-item">
            <input type="text" name="username" placeholder="用户名">
        </div>
        <div class="input-item">
            <input type="password" name="pwd" placeholder="密码">
        </div>
        <button type="submit" class="login-btn">安全登录</button>
    </form>

    <div class="link">
        没有账号？<a href="register.html">立即注册</a>
    </div>
    <div class="link">
        游客登录？<a href="index.html">首页</a>
    </div>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();
        let formData = new FormData(this);

        fetch("login.php", {
            method: "POST",
            body: formData
        }).then(res => res.json()).then(data => {
            if (data.code === 1) {
                localStorage.setItem("isLogin", "true");
                alert(data.msg);
                location.href = "index.php";
            } else {
                alert(data.msg);
            }
        }).catch(err => {
            console.error(err);
            alert("网络错误");
        });
    });
</script>

</body>
</html>
